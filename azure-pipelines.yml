trigger:
- main
pool:
 name: dhurander
stages:
  - stage: terraforminit
    displayName: terraform init
    jobs:
      - job: 
        displayName: terraform init
        steps:
        - task: PowerShell@2
          displayName: 'Terraform Init'
          inputs:
            targetType: 'inline'
            script: |
              terraform init -migrate-state
              terraform init -reconfigure
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            backendServiceArm: 'data'
            backendAzureRmStorageAccountName: 'stagefile123321'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'dev.terraform'

        